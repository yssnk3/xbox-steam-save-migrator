<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="blue">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam ↔ Xbox PC 游戏存档双端移植与转换工具</title>
    <!-- 只用 Inter 一套无衬线；离线时回退系统字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // 首帧前按缓存上色，避免浅色用户看到一帧深色
      try {
        var raw = localStorage.getItem('sxsm-appearance');
        var a = raw ? JSON.parse(raw) : {};
        var mode = a.theme === 'light' || a.theme === 'dark' ? a.theme : 'light';
        var resolved = mode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.accent = a.accent || 'blue';
        document.documentElement.dataset.themeMode = mode;
        // 布局同理：首帧前套上缓存的几何值，避免侧栏闪一下默认宽度
        var l = JSON.parse(localStorage.getItem('sxsm-layout') || '{}');
        var lim = {
          sidebarWidth: [180, 420], topbarHeight: [36, 72], contentPadding: [16, 96],
          logWidth: [280, 720], logHeight: [160, 600], aiListWidth: [200, 420], aiPanelHeight: [420, 1200],
        };
        for (var k in lim) {
          var v = Number(l[k]);
          if (!isFinite(v)) continue;
          var r = lim[k];
          document.documentElement.style.setProperty('--layout-' + k, Math.min(r[1], Math.max(r[0], Math.round(v))) + 'px');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
